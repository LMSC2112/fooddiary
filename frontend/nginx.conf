# =============================================================================
# FoodDiary — Nginx Configuration
# frontend/nginx.conf
#
# Key rule: try_files $uri $uri/ /index.html
# This tells Nginx: if the file doesn't exist as a static asset,
# serve index.html and let React Router handle the path client-side.
# Without this, F5 on /my-todo-list returns 404.
# =============================================================================

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;

  # redirige /api al backend
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  
  # React Router support — serve index.html for all unknown paths
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively (Vite adds content hashes to filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
}
