
<style>
#erd { padding: 1rem 0; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2C2C2A' : '#F1EFE8',
    primaryBorderColor: dark ? '#5F5E5A' : '#B4B2A9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  USERS {
    UUID id PK
    VARCHAR name
    VARCHAR email UK
    VARCHAR password_hash
    VARCHAR reset_password_token "Nullable"
    TIMESTAMP reset_password_expires "Nullable"
    VARCHAR preferred_language "Default en"
    TIMESTAMP created_at
  }

  LOCAL_RECIPES {
    UUID id PK
    UUID user_id FK
    VARCHAR title
    TEXT instructions
    INTEGER base_servings
    VARCHAR serving_size "Grande | Mediano | Pequeno"
    VARCHAR category "e.g. Breakfast, Dessert"
    VARCHAR image_url "Nullable"
    TIMESTAMP created_at
    TIMESTAMP updated_at
  }

  LOCAL_INGREDIENTS {
    UUID id PK
    UUID recipe_id FK
    VARCHAR name
    NUMERIC base_quantity
    VARCHAR base_unit "g | ml | unidad..."
  }

  USER_RECIPES_INTERACTION {
    UUID id PK
    UUID user_id FK
    UUID local_recipe_id FK "Nullable"
    VARCHAR api_recipe_id "Nullable"
    BOOLEAN en_todo_list "Default false"
    BOOLEAN en_recetario "Default false"
    TIMESTAMP created_at "Saved to To-Do date"
    TIMESTAMP updated_at "Last modification"
    TIMESTAMP fecha_estado_receta "Cooked or Discarded timestamp"
  }

  USERS ||--o{ LOCAL_RECIPES : "publishes"
  USERS ||--o{ USER_RECIPES_INTERACTION : "manages"
  LOCAL_RECIPES ||--o{ LOCAL_INGREDIENTS : "contains (CASCADE DELETE)"
  LOCAL_RECIPES ||--o{ USER_RECIPES_INTERACTION : "receives (local)"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
